<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10111a" media="(prefers-color-scheme: dark)">
<title>PilotPro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Démarrage -->
<section id="ecran-attente" class="ecran plein">
  <img src="logo.svg" alt="" class="grand-logo">
  <h1>PilotPro</h1>
  <div class="roue"></div>
  <p id="attente-texte" class="doux">Préparation…</p>
</section>

<!-- Connexion -->
<section id="ecran-connexion" class="ecran plein cache">
  <img src="logo.svg" alt="" class="grand-logo">
  <h1>PilotPro</h1>
  <p class="doux centre">Le pilotage de la semaine, dans la poche.</p>
  <button id="btn-connexion" class="principal large">Se connecter avec Microsoft</button>
  <button id="btn-installer" class="large cache">Installer PilotPro sur ce téléphone</button>
  <button id="btn-demo" class="lien">Essayer la démonstration</button>
  <button id="btn-aide-install" class="lien petit cache">L'application ne s'installe pas ?</button>
  <p id="connexion-erreur" class="erreur cache"></p>
</section>

<!-- Application -->
<section id="ecran-appli" class="cache">
  <header>
    <img src="logo.svg" alt="" class="petit-logo">
    <div class="titres"><h2 id="titre">Accueil</h2><div id="sous-titre" class="doux petit"></div></div>
    <button id="btn-actualiser" class="rond" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <button id="btn-menu" class="rond" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>
  <div id="bandeau" class="bandeau cache"></div>
  <main>
    <div id="v-accueil" class="vue"></div>
    <div id="v-actions" class="vue cache"></div>
    <div id="v-questions" class="vue cache"></div>
    <div id="v-risques" class="vue cache"></div>
    <div id="v-plan" class="vue cache"></div>
  </main>
  <div id="barre-questions" class="barre-enregistrer cache">
    <button id="btn-q-annuler">Annuler</button>
    <button id="btn-q-enregistrer" class="principal">Enregistrer</button>
  </div>
  <button id="btn-nouvelle" class="fab cache" aria-label="Nouvelle action"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav>
    <button data-vue="accueil" class="actif"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Accueil</button>
    <button data-vue="actions"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Actions</button>
    <button data-vue="questions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg>Questions</button>
    <button data-vue="risques"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></svg>Risques</button>
    <button data-vue="plan"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/></svg>Plan</button>
  </nav>
</section>

<!-- Fenêtre du bas (fiche action, menu) -->
<dialog id="feuille"><div id="feuille-contenu"></div></dialog>
<div id="occupe" class="occupe cache"><div class="roue"></div><span id="occupe-texte">Lecture des classeurs…</span></div>
<div id="toast" class="toast cache"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
