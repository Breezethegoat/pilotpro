<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 5.5 50 50" width="64" height="64">
  <title>PilotPro</title>
  <defs>
    <!-- Coordonnées absolues : une ligne verticale n'a pas de largeur, un dégradé « relatif » ne s'y dessinerait pas. -->
    <linearGradient id="pp-accent" gradientUnits="userSpaceOnUse" x1="14" y1="8" x2="32" y2="50">
      <stop offset="0" stop-color="#b9a4ff"/><stop offset="1" stop-color="#5f7bff"/>
    </linearGradient>
    <linearGradient id="pp-boucle" gradientUnits="userSpaceOnUse" x1="23" y1="24" x2="42" y2="42">
      <stop offset="0" stop-color="#7f8cff"/><stop offset="1" stop-color="#4b55d8"/>
    </linearGradient>
  </defs>
  <!-- Symbole seul, sans tuile : fond transparent, lisible en thème clair comme sombre. -->
  <!-- P-flèche : la hampe du P est une flèche qui indique le cap -->
  <path d="M23 50V17" stroke="url(#pp-accent)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M23 8 31 18H15z" fill="url(#pp-accent)"/>
  <path d="M23 24h10a9 9 0 0 1 0 18H23" stroke="url(#pp-boucle)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
